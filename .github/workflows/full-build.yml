name: v3 - Build Package and Deploy MCP Worker

on:
  push:
    branches: [v3]
    paths:
      - 'packages/core/**'
      - 'workers/mcp/**'
      - '.github/workflows/full-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: 'pkg-v3'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        run: |
          CURRENT=$(jq -r .version packages/core/package.json)
          PREVIOUS=$(git show HEAD~1:packages/core/package.json 2>/dev/null | jq -r .version || echo "")
          CORE_FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'packages/core/src/')

          if [ -n "$CORE_FILES_CHANGED" ] && [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "::warning::packages/core version ($CURRENT) was not bumped from the previous commit. Did the pre-commit hook run?"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm build:core

      # The Storybook (ui-kit-v3.omnitok.cloud) is no longer built here: the
      # one Storybook of the platform lives in the BI monorepo
      # (tools/storybook) and shows the kit at the commit the apps pin. The
      # MCP Worker below serves that site's manifests.

      - name: Deploy MCP Worker
        run: pnpm dlx wrangler deploy
        working-directory: workers/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OMNITOK_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.OMNITOK_CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare and push to pkg branch
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create temp directory with package contents
          mkdir -p /tmp/pkg
          cp packages/core/package.json /tmp/pkg/
          cp -r packages/core/dist /tmp/pkg/
          # The source travels with the package: the monorepo Storybook reads
          # each component's props from it (its manifest refuses dist files).
          cp -r packages/core/src /tmp/pkg/
          cp packages/core/README.md /tmp/pkg/ 2>/dev/null || true

          # Get version for commit message
          VERSION=$(cat packages/core/package.json | jq -r .version)

          # Switch to pkg branch (create orphan if doesn't exist)
          git fetch origin pkg-v3:pkg-v3 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/pkg-v3; then
            git checkout pkg-v3
          else
            git checkout --orphan pkg-v3
            git rm -rf . 2>/dev/null || true
          fi

          # Clean current directory and copy package contents
          rm -rf ./* 2>/dev/null || true
          cp -r /tmp/pkg/* .

          # Commit and push
          git add .
          git commit -m "Release v${VERSION} (source ${GITHUB_SHA})" --allow-empty
          git tag -f "v${VERSION}"
          git push origin pkg-v3 --force
          git push origin "v${VERSION}" --force
